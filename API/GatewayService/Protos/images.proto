syntax = "proto3";

option csharp_namespace = "ImageService";

service GrpcImage {
    rpc GetImage (GetImageRequest) returns (GrpcImageResponse);
}

message GetImageRequest {
    string ItemId = 1;
}

message GrpcImageModel {
    string ItemId = 1;
    string image = 2;
}

message GrpcImageResponse {
    GrpcImageModel image = 1;
}