syntax = "proto3";

option csharp_namespace = "ReportService";

service GrpcReports {  
    rpc GetNotificationReport (GetNotificationReportRequest) returns (GrpcNotificationReportResponse);
}

message GetNotificationReportRequest {
    string NotificationReportRequest = 1;
}

message GrpcNotificationReportResponse {
    string notificationRezult = 1;
}